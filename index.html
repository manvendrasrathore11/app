if(s==='reset')return `<main>${back('go','login')}${bear(S.sent?'celebrate':'wave',130)}<h1>${S.sent?'Check your inbox':'Reset password'}</h1>${S.sent?`<p>If an account exists, a reset link is on its way. (Simulated: no email is sent in this prototype.)</p><button class="btn" data-a="go" data-v="login">Back to login</button>`:`<p>No stress, it happens. Enter your email and we will send a link.</p><label>Email<input id="re" type="email" autocomplete="email"></label><p id="rerr" style="color:var(--err)" role="alert"></p><button class="btn" data-a="reset">Send reset link</button>`}</main>`;

if(s==='lead'){const you=S.cp*9+(S.done?10:0),R=[['Maya',68],['Jordan',61],['You',you],['Sam',40],['Priya',33]].sort((a,b)=>b[1]-a[1]),mx=R[0][1];return `<main>${back('tabgo','comm')}<h1>Leaderboard</h1><p>7-Day Show Up Challenge. Points reward showing up and improving, not weight or calories.</p>${R.map((r,i)=>`<div class="card"><div class="row"><b>${i+1}. ${r[0]}${r[0]==='You'?' ⭐':''}</b><b>${r[1]} pts</b></div><div class="bar"><i style="width:${Math.round(r[1]/mx*100)}%"></i></div></div>`).join('')}<div class="card row"><label for="pub">Show me on public rankings</label><input id="pub" type="checkbox" data-a="pub" ${S.pub?'checked':''} style="width:28px;height:28px"></div><p>${S.pub?'Public: other challenge members can see your first name and points.':'Private: only friends see your name. Nothing else is shared.'}</p><p>Sample data, not real users.</p></main>`}
if(s==='friends')return `<main>${back('tabgo','comm')}<h1>Friends</h1>${[['Maya','4-day streak'],['Jordan','2-day streak'],['Sam','Back after a break 🎉']].map(f=>`<div class="card"><b>${f[0]}</b><p>${f[1]}</p></div>`).join('')}<h2>Invite a friend</h2><label>Email<input id="fe" type="email"></label><p id="ferr" style="color:var(--err)" role="alert"></p><button class="btn" data-a="invite">Send invite (simulated)</button>${S.inv.map(e=>`<div class="card"><b>${e}</b><p>Invited · pending</p></div>`).join('')}<p>Sample friends. No real accounts or emails.</p></main>`;
if(s==='nut')return `<main>${back('tabgo','move')}${bear('idle',110)}<h1>Nutrition guide</h1><div class="card"><span class="tag v">Cited</span><p>The WHO healthy diet fact sheet suggests at least 400 g (about 5 portions) of fruit and vegetables a day. Check who.int for the full, current guidance.</p></div><h2>Easy meal ideas</h2>${MEALS.map((m,i)=>`<div class="card row"><div><span class="tag u">Idea</span><br><b>${m[0]}</b><p>${m[1]}</p></div><button class="chip" data-a="meal" data-v="${i}">Open</button></div>`).join('')}<p>Educational only, not medical or dietetic advice.</p></main>`;
if(s==='meal'){const m=MEALS[S.meal];return `<main>${back('go','nut')}<h1>${m[0]}</h1><p>${m[1]} · beginner friendly</p><div class="card"><b>What you need</b><p>${m[2]}</p></div><div class="card"><b>Why it works</b><p>${m[3]}</p></div><span class="tag u">Idea, not verified advice</span><p>Allergies or a medical condition? Ask a doctor or registered dietitian.</p></main>`}
return view2()}
function view2(){const t=S.tab;let h='';
if(t==='home'){const wk=['M','T','W','T','F','S','S'];
h=`<main>${hdr()}${S.energy?'':''}${bear(S.away&&!S.energy?'welcomeBack':S.done?'celebrate':S.energy==='low'?'rest':S.energy==='high'?'run':S.energy==='ok'?'walk':'idle',150)}${bub(S.away&&!S.energy?'Missed a day? No guilt. Welcome back!':S.done?'Done for today. Rest is part of progress, too.':S.energy==='low'?"Busy day? Let's keep it tiny.":S.energy?"Let's do this!":'How is your energy today?')}
${!S.done?`<div class="row" style="margin-top:12px" role="group" aria-label="Energy check-in">${['low','ok','high'].map(e=>`<button class="opt ${S.energy===e?'on':''}" style="text-align:center;margin:0" data-a="energy" data-v="${e}">${{low:'😴 Low',ok:'🙂 Okay',high:'💪 High'}[e]}</button>`).join('')}</div>`:''}
<div class="card"><b>Today's mission</b><p>${S.done?'Completed ✓':short()?'Tiny reset · 5 min · +50 XP':'Full-body starter · '+(mins()||10)+' min · +50 XP'}</p><div class="bar"><i style="width:${S.done?100:0}%"></i></div><button class="btn" data-a="go" data-v="detail" ${S.done?'disabled style="opacity:.4"':''}>${S.done?'Done':'See mission'}</button></div>
<div class="cal" aria-label="This week">${S.days.map((d,i)=>`<div class="${d?'f':''} ${i===S.today?'t':''}">${wk[i]}</div>`).join('')}</div></main>`}
if(t==='move')h=`<main><h1>Move</h1>${[['Gentle stretch','5 min · Beginner'],['Bodyweight basics','10 min · Beginner'],['Recovery flow','8 min · Rest day friendly']].map(w=>`<div class="card row"><div><b>${w[0]}</b><p>${w[1]}</p></div><button class="chip" data-a="go" data-v="detail">Open</button></div>`).join('')}<h2>Learn</h2><div class="card"><span class="tag v">Cited</span><br><b>How much activity is enough?</b><p>WHO guidelines (2020) suggest adults aim for 150–300 minutes of moderate activity a week, and any movement counts.</p><p style="font-size:13px">Source: WHO Guidelines on physical activity and sedentary behaviour, 2020. Educational only, not medical advice.</p></div><div class="card row"><div><span class="tag v">Cited</span><br><b>Nutrition guide</b><p>Simple meal ideas</p></div><button class="chip" data-a="go" data-v="nut">Open</button></div></main>`;
if(t==='prog'){const nx=100-S.xp%100;h=`<main><h1>Progress</h1><div class="card"><b>Level ${lvl(S.xp)}</b><div class="bar x"><i style="width:${S.xp%100}%"></i></div><p>${nx} XP to next level</p></div><div class="card"><b>Streak: ${S.streak} days</b><p>Rest days never break it. A streak shield protects one missed scheduled day (prototype rule).</p><div class="cal">${S.days.map((d,i)=>`<div class="${d?'f':''}">${'MTWTFSS'[i]}</div>`).join('')}</div></div><div class="card"><b>Badges</b><p>${S.streak>=3?'🏅 3-day streak ':''}${S.done?'⭐ First mission ':''}${S.joined?'🤝 Team player':''}</p></div><div class="card"><b>History</b>${S.hist.map(x=>`<p>${x.d}: ${x.n} · +${x.x} XP</p>`).join('')}</div></main>`}
if(t==='comm')h=`<main><h1>Community</h1><div class="labg"><button class="chip" data-a="go" data-v="lead">🏆 Leaderboard</button><button class="chip" data-a="go" data-v="friends">👥 Friends</button></div><div class="card"><b>7-Day Show Up Challenge</b><p>Score rewards participation, not raw performance. Private by default.</p>${S.joined?`<div class="bar"><i style="width:${S.cp/7*100}%"></i></div><p>${S.cp}/7 days (sample data)</p>`:`<button class="btn" data-a="join">Join challenge</button>`}</div><div class="row"><h2>Feed</h2><button class="chip" data-a="compose">+ Post</button></div>${S.compose?`<div class="card"><textarea id="pt" rows="3" placeholder="Share an experience or tip"></textarea><p>It will be labeled as personal experience, not verified advice.</p><button class="btn" data-a="publish">Publish (prototype)</button></div>`:''}${S.posts.map(p=>`<div class="card"><span class="tag ${p.k==='e'?'u':'v'}">Personal experience</span><br><b>${p.u}</b><p>${p.t}</p><button class="chip" data-a="toast" data-v="Reported (simulated moderation)">Report</button></div>`).join('')}</main>`;
if(t==='prof')h=`<main>${bear('idle',130)}<h1>Profile</h1><div class="card"><b>${S.a.goal||'Build a consistent habit'}</b><p>${S.a.time||'10 minutes'} · ${S.a.lvl||'Beginner'}</p></div><div class="card row"><label for="rm">Reduced motion</label><input id="rm" type="checkbox" data-a="rm" ${S.rm?'checked':''} style="width:28px;height:28px"></div><div class="card row"><label for="fs">Fast demo timer</label><input id="fs" type="checkbox" data-a="fs" ${S.fast?'checked':''} style="width:28px;height:28px"></div><div class="card"><b>Mascot lab</b>${bear(S.lab,170,'lab')}<p style="text-align:center">State: <b>${S.lab}</b></p><div class="labg">${STATES.map(s=>`<button class="chip" data-a="lab" data-v="${s}" aria-pressed="${S.lab===s}">${s}</button>`).join('')}</div><button class="btn sec" data-a="away">Simulate returning after a break</button><button class="btn sec" data-a="lvl">Preview level-up screen</button></div><button class="btn sec" data-a="modal">Sign out</button></main>`;
return h+nav()}
function render(){const a=$('#app');a.className=S.rm?'rm':'';let h=view();
if(S.toast)h+=`<div class="toast" role="status">${S.toast}</div>`;
if(S.modal)h+=`<div class="modal" role="dialog" aria-modal="true"><div><h2>Sign out?</h2><p>Progress is stored only in this prototype session.</p><button class="btn" data-a="signout">Sign out</button><button class="btn sec" data-a="modal0">Cancel</button></div></div>`;
a.innerHTML=h;mountBears();post();save();if(S.cf){S.cf=false;if(!S.rm)for(let i=0;i<40;i++){const c=document.createElement('i');c.className='cf';c.onanimationend=()=>c.remove();c.style.cssText=`left:${Math.random()*100}%;background:${['#F59E2B','#F7892B','#72C24E','#2F7F36'][i%4]};animation-delay:${Math.random()*.5}s`;a.appendChild(c)}}}
let timer;const toast=m=>{const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;$('#app').appendChild(d);setTimeout(()=>d.remove(),1800)};
function tick(){clearInterval(timer);timer=setInterval(()=>{if(S.paused||S.cheer||S.scr!=='active')return;S.sec--;if(S.sec<=0)next();else{const b=$('.ring b'),c=$('.ring circle:last-child');if(b){b.textContent=fmt(S.sec);c.setAttribute('stroke-dashoffset',502.65*(1-S.sec/S.dur))}}},1000)}
function next(){const n=short()?2:3;S.ex++;S.sec=S.dur;if(S.ex>=n)complete();else render()}
function complete(){clearInterval(timer);if(!S.done){S.done=true;const o=S.xp;S.xp+=50;S.streak++;S.days[S.today]=1;S.hist.unshift({n:short()?'Tiny reset':'Daily mission',x:50,d:'Today'});S.cp=S.joined?Math.min(7,S.cp+1):S.cp;S.dispXp=o;S.cf=true;S.scr='done';render();const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/(S.rm?1:900));S.dispXp=Math.round(o+50*p);const e=$('#xpn');if(e)e.textContent=S.dispXp;if(p<1)requestAnimationFrame(f)})(t0)}else{S.scr='app';render()}}
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==='go'){S.scr=v;if(v==='app')S.tab='home'}
else if(a==='signup'){const em=$('#em').value,pw=$('#pw').value;if(!/^\S+@\S+\.\S+$/.test(em)){$('#err').textContent='Enter a valid email like you@school.edu.';return}if(pw.length<6){$('#err').textContent='Password needs at least 6 characters.';return}S.scr='ob';S.step=0}
else if(a==='pick')S.a[OB[S.step].k]=v;
else if(a==='obnext'){if(S.step<OB.length-1)S.step++;else S.scr='plan'}
else if(a==='obback'){if(S.step>0)S.step--;else S.scr='intro'}
else if(a==='start'){S.scr='detail'}
else if(a==='tab'){S.tab=v;S.compose=false}
else if(a==='energy'){S.energy=v;S.away=false}
else if(a==='lab')S.lab=v;
else if(a==='away'){S.away=true;S.energy=null;S.tab='home'}
else if(a==='begin'){S.away=false;S.scr='active';S.ex=0;S.dur=dur();S.sec=S.dur;S.paused=false;S.cheer=true;setTimeout(()=>{S.cheer=false;if(S.scr==='active')render()},1500);tick()}
else if(a==='pause')S.paused=!S.paused;
else if(a==='skip')return next();
else if(a==='finish'){if(lvl(S.xp)>lvl(S.xp-50)){S.scr='levelup';S.cf=true}else{S.scr='app';S.tab='home'}}
else if(a==='join'){S.joined=true;render();return toast('Joined! Your workouts now count.')}
else if(a==='compose')S.compose=!S.compose;
else if(a==='publish'){const t=$('#pt').value.trim();if(!t)return toast('Write something first.');S.posts.unshift({u:'You',t,k:'e'});S.compose=false;S.xp+=0;render();return toast('Published in this prototype only.')}
else if(a==='rm'){S.rm=b.checked}else if(a==='fs'){S.fast=b.checked}else if(a==='pub'){S.pub=b.checked}else if(a==='tabgo'){S.scr='app';S.tab=v}else if(a==='meal'){S.meal=+v;S.scr='meal'}else if(a==='lvl'){S.scr='levelup';S.cf=true}
else if(a==='reset'){if(!/^\S+@\S+\.\S+$/.test($('#re').value)){$('#rerr').textContent='Enter a valid email like you@school.edu.';return}S.sent=true}
else if(a==='invite'){const e=$('#fe').value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){$('#ferr').textContent='Enter a valid email.';return}S.inv.push(e)}
else if(a==='toast')return toast(v);
else if(a==='modal')S.modal=1;else if(a==='modal0')S.modal=null;
else if(a==='signout'){S.modal=null;S.scr='welcome';S.tab='home'}
render()});
function board(){const a=$('#app');a.className='rm';a.style.cssText='max-width:none;width:auto;height:auto;overflow:visible;display:block';document.body.style.cssText='display:block;height:auto';document.documentElement.style.height='auto';
const A={goal:'Get stronger',time:'20 minutes',lvl:'Beginner',bar:'Busy schedule'},H={scr:'app',tab:'home',a:A},
F=[['01 Welcome',{scr:'welcome'}],['02 Intro and Sign-up',{scr:'intro'}],['03 Login',{scr:'login'}],['04 Onboarding Goal',{scr:'ob',step:0,a:{goal:'Get stronger'}}],['05 Onboarding Time',{scr:'ob',step:1,a:{time:'20 minutes'}}],['06 Onboarding Level',{scr:'ob',step:2,a:{}}],['07 Onboarding Barrier',{scr:'ob',step:3,a:{bar:'Busy schedule'}}],['08 Plan Summary',{scr:'plan',a:A}],['09 Mission Detail',{scr:'detail',a:A}],['10 Active Workout',{scr:'active',a:A,ex:1,dur:400,sec:312}],['11 Completion',{scr:'done',a:A,done:true,xp:90,dispXp:90}],['12 Home Check-in',H],['13 Home Low Energy',{...H,energy:'low'}],['14 Home Welcome Back',{...H,away:true}],['15 Move and Learn',{...H,tab:'move'}],['16 Progress',{...H,tab:'prog',done:true}],['17 Community',{...H,tab:'comm',joined:true}],['18 Profile',{...H,tab:'prof'}],['19 Reset Password',{scr:'reset'}],['20 Reset Sent',{scr:'reset',sent:true}],['21 Leaderboard',{scr:'lead',a:A,cp:5,done:true}],['22 Friends',{scr:'friends',a:A,inv:['alex@school.edu']}],['23 Nutrition Guide',{scr:'nut',a:A}],['24 Meal Idea',{scr:'meal',meal:1,a:A}],['25 Level-up',{scr:'levelup',a:A,xp:120}]],
keep={...S};let h='';F.forEach(([n,o],i)=>{Object.assign(S,keep,{energy:null,away:false,done:false,joined:false,cheer:false,paused:false,compose:false,lab:'idle',modal:null,sent:false,meal:0,inv:[]},o);h+=`<div class="cell"><div class="fl">${n}</div><section class="frame" id="frame-${i+1}" data-name="${n}">${view().replace(/data-slot="m"/g,'data-slot="b'+i+'"')}</section></div>`});Object.assign(S,keep);a.innerHTML=`<div class="board">${h}</div>`;mountBears()}
try{const j=JSON.parse(localStorage.getItem('bm')||'null');if(j){Object.assign(S,j);S.dispXp=S.xp;if(OB.every(o=>S.a[o.k])){S.scr='app';S.away=true}}}catch(e){}
location.hash==='#board'?board():render();
</script></body></html>
